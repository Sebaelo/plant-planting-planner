<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="./main.js" defer></script>
    <title>Plantering</title>
  </head>
  <body>
    <h1>Planteringsplanerare</h1>

    <form id="plant-form">
      <div class="form-field">
        <label for="name">Växtnamn</label>
        <input type="text" id="name" name="plantName" required />
      </div>

      <div class="form-field">
        <label for="amount">Mängd</label>
        <input
          type="number"
          id="amount"
          name="amountToPlant"
          class="no-arrows"
          required
        />
      </div>

      <div class="form-field">
        <label for="month">Månad</label>
        <select id="month" name="monthToPlant" required>
          <option value="">Välj månad</option>
          <option value="1">Januari</option>
          <option value="2">Februari</option>
          <option value="3">Mars</option>
          <option value="4">April</option>
          <option value="5">Maj</option>
          <option value="6">Juni</option>
          <option value="7">Juli</option>
          <option value="8">Augusti</option>
          <option value="9">September</option>
          <option value="10">Oktober</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
      </div>

      <div class="form-field">
        <label for="category">Kategori</label>
        <select id="category" name="plantCategory" required>
          <option value="">Välj kategori</option>
        </select>
      </div>

      <div class="form-field form-field-wide">
        <label for="advice">Skötselråd</label>
        <textarea
          id="advice"
          name="plantingAdvice"
          rows="5"
          required
        ></textarea>
      </div>
    </form>

    <div class="search-wrapper">
      <div class="search-icon-container">
        <input
          type="search"
          id="search-plants"
          name="q"
          placeholder="Sök efter växter..."
        />
        <img class="search-icon" src="./assets/icons/search.png" />
      </div>
      <button id="btn-submit" type="submit" form="plant-form">Lägg till</button>
    </div>

    <p id="display-messages"></p>

    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>Växtnamn</th>
            <th>Mängd</th>
            <th>Kategori</th>
            <th>Månad</th>
            <th class="icons-cell"></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </section>

    <dialog class="plant-modal"></dialog>
  </body>
</html>
